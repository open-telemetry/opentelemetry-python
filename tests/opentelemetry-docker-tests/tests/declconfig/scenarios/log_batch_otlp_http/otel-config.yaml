file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-log-batch-otlp-http
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
logger_provider:
  processors:
    - batch:
        schedule_delay: 100
        export_timeout: 5000
        max_queue_size: 64
        max_export_batch_size: 8
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/logs
