file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-trace-tracer-configurator
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
  tracer_configurator/development:
    default_config:
      enabled: true
    tracers:
      - name: disabled.*
        config:
          enabled: false
