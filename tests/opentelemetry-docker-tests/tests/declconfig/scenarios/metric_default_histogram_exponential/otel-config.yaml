file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-metric-default-histogram-exponential
meter_provider:
  readers:
    - periodic:
        interval: 500
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/metrics
            default_histogram_aggregation: base2_exponential_bucket_histogram
