description: >
  `composite_list` loads b3multi and jaeger propagators through entry points.
until:
  - spans:
      name: incoming
expect:
  - spans:
      name: incoming
      parent: {name: outgoing}
      attributes:
        values:
          carrier.keys: uber-trace-id,uberctx-user.id,x-b3-sampled,x-b3-spanid,x-b3-traceid
          baggage.user.id: u-123
      count: 1
