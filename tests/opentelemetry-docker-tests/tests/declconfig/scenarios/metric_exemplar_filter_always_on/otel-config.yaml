file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-metric-exemplar-filter-always-on
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
meter_provider:
  readers:
    - periodic:
        interval: 500
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/metrics
  exemplar_filter: always_on
