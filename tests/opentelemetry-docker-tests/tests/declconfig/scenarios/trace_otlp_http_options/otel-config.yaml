file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-trace-otlp-http-options
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
            compression: gzip
            timeout: 5000
            headers:
              - name: x-declconfig
                value: header
            headers_list: x-declconfig-list=list
