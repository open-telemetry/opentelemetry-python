file_format: "1.0"
resource:
  detection/development:
    detectors:
      - otel: {}
    attributes:
      included: ["keep[bc]", "keep[bc].*", "drop*"]
      excluded: ["keep[bc].drop", "drop[bc]"]
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
  tracer_configurator/development:
    tracers:
      - name: "disabled[bc]"
        config: {enabled: false}
      - name: "wild[bc].?"
        config: {enabled: false}
  sampler:
    composite/development:
      rule_based:
        rules:
          - attribute_patterns:
              key: route
              included: ["keep[bc]*"]
              excluded: ["keep[bc].drop", "keep[bc].?ecret"]
            sampler:
              always_on:
meter_provider:
  readers:
    - periodic:
        # Collect on shutdown so metric counts are independent of export timing.
        interval: 60000
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/metrics
  meter_configurator/development:
    meters:
      - name: "disabled[bc]"
        config: {enabled: false}
      - name: "wild[bc].?"
        config: {enabled: false}
logger_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/logs
  logger_configurator/development:
    loggers:
      - name: "disabled[bc]"
        config: {enabled: false}
      - name: "wild[bc].?"
        config: {enabled: false}
