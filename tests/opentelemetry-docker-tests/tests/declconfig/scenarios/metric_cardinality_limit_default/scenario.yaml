description: >
  Without any configured limit, a metric stream is limited to 2000 attribute sets plus the overflow
  point, which aggregates the other 100 measurements.
until:
  - exited: {}
expect:
  - metric: {name: requests, count: 2001}
  - metric:
      name: requests
      data_point:
        attributes: {values: {otel.metric.overflow: true}, strict: true}
        value: 100
