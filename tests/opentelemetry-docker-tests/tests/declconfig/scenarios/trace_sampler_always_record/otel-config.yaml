file_format: "1.2"
resource:
  attributes:
    - name: service.name
      value: declconfig-trace-sampler-always-record
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
  sampler:
    always_record:
      root:
        parent_based:
          root:
            always_off:
