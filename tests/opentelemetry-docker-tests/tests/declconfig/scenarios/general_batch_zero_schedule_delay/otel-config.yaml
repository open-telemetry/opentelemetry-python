file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-general-batch-zero-schedule-delay
tracer_provider:
  processors:
    - batch:
        schedule_delay: 0
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
logger_provider:
  processors:
    - batch:
        schedule_delay: 0
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/logs
