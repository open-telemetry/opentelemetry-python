file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-metric-cardinality-limits-reader
meter_provider:
  readers:
    - periodic:
        interval: 60000
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/metrics
        cardinality_limits:
          default: 5
          counter: 3
