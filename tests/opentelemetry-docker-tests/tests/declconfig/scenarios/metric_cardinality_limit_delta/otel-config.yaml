file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-metric-cardinality-limit-delta
meter_provider:
  readers:
    - periodic:
        interval: 2000
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/metrics
            temporality_preference: delta
        cardinality_limits:
          default: 3
