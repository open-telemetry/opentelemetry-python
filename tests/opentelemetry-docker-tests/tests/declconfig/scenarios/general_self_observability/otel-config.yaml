file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-general-self-observability
tracer_provider:
  processors:
    - batch:
        schedule_delay: 100
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
meter_provider:
  readers:
    - periodic:
        interval: 500
        exporter:
          otlp_grpc:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4317
