file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-metric-otlp-grpc
meter_provider:
  readers:
    - periodic:
        interval: 500
        exporter:
          otlp_grpc:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4317
            compression: gzip
