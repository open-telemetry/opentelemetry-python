file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: ${DECLCONFIG_SERVICE_NAME}
    - name: env.standalone
      value: ${DECLCONFIG_INT}
    - name: env.quoted
      value: "${DECLCONFIG_INT}"
    - name: env.embedded
      value: v-${DECLCONFIG_INT}
    - name: env.default
      value: ${DECLCONFIG_UNSET:-fallback}
    - name: env.empty
      value: "${DECLCONFIG_EMPTY:-fallback}"
    - name: env.escaped
      value: $${DECLCONFIG_INT}
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
