file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-general-attribute-limits
attribute_limits:
  attribute_count_limit: 2
  attribute_value_length_limit: 4
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/traces
logger_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: http://${OTEL_COLLECTOR_ENDPOINT}:4318/v1/logs
