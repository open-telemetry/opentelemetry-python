file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-otlp-http-json-tls
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: https://otel-collector.test:4318/v1/traces
            encoding: json
            tls:
              ca_file: ${TLS_CERTS_DIR}/ca.crt
meter_provider:
  readers:
    - periodic:
        interval: 500
        exporter:
          otlp_http:
            endpoint: https://otel-collector.test:4318/v1/metrics
            encoding: json
            tls:
              ca_file: ${TLS_CERTS_DIR}/ca.crt
logger_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: https://otel-collector.test:4318/v1/logs
            encoding: json
            tls:
              ca_file: ${TLS_CERTS_DIR}/ca.crt
