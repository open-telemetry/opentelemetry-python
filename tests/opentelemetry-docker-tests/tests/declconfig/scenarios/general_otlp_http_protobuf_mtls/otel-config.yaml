file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: declconfig-otlp-http-protobuf-mtls
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: https://otel-collector.test:4318/v1/traces
            encoding: protobuf
            tls:
              ca_file: ${TLS_CERTS_DIR}/ca.crt
              cert_file: ${TLS_CERTS_DIR}/client.crt
              key_file: ${TLS_CERTS_DIR}/client.key
meter_provider:
  readers:
    - periodic:
        interval: 500
        exporter:
          otlp_http:
            endpoint: https://otel-collector.test:4318/v1/metrics
            encoding: protobuf
            tls:
              ca_file: ${TLS_CERTS_DIR}/ca.crt
              cert_file: ${TLS_CERTS_DIR}/client.crt
              key_file: ${TLS_CERTS_DIR}/client.key
logger_provider:
  processors:
    - simple:
        exporter:
          otlp_http:
            endpoint: https://otel-collector.test:4318/v1/logs
            encoding: protobuf
            tls:
              ca_file: ${TLS_CERTS_DIR}/ca.crt
              cert_file: ${TLS_CERTS_DIR}/client.crt
              key_file: ${TLS_CERTS_DIR}/client.key
