description: >
  Exports a span, a metric and a log record as OTLP/HTTP json over mutual TLS, presenting a client certificate the collector requires.
until:
  - spans:
      name: tls-span
  - metric:
      name: tls.requests
      min: 1
  - logs:
      body_pattern: tls log
expect:
  - resource:
      attributes: {values: {service.name: declconfig-otlp-http-json-mtls}}
  - spans:
      name: tls-span
      count: 1
  - metric:
      name: tls.requests
      type: sum
      data_point: {value: 1}
  - logs:
      body: tls log
      span: {name: tls-span}
      count: 1
