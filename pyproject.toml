[tool.ruff.lint.per-file-ignores]
"docs/**/*.*" = ["PLE"]
"opentelemetry-configuration/tests/test_models.py" = ["E402", "PLC0415"]
"shim/opentelemetry-opentracing-shim/tests/*" = ["TID252"]

[tool.ruff.lint.isort]
known-third-party = [
  "psutil",
  "pytest",
  "redis",
  "redis_opentracing",
  "opencensus",
]
known-first-party = ["opentelemetry", "opentelemetry_example_app"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"

include = [
  "opentelemetry-semantic-conventions",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-configuration",
  "opentelemetry-proto-json",
  "exporter/opentelemetry-exporter-otlp-json-file",
  "exporter/opentelemetry-exporter-http-transport",
  "exporter/opentelemetry-exporter-otlp-proto-grpc",
  "exporter/opentelemetry-exporter-otlp-proto-http",
  "exporter/opentelemetry-exporter-otlp-json-common",
  "exporter/opentelemetry-exporter-otlp-common",
  "codegen/opentelemetry-codegen-json"
]

exclude = [
  "opentelemetry-sdk/tests",
  "opentelemetry-configuration/tests",
  "opentelemetry-sdk/src/opentelemetry/sdk/metrics/_internal/__init__.py",
  "opentelemetry-sdk/src/opentelemetry/sdk/metrics/_internal/aggregation.py",
  "opentelemetry-sdk/src/opentelemetry/sdk/metrics/_internal/exemplar/exemplar_reservoir.py",
  "opentelemetry-sdk/src/opentelemetry/sdk/metrics/_internal/export/",
  "opentelemetry-sdk/src/opentelemetry/sdk/metrics/_internal/instrument.py",
  "opentelemetry-sdk/src/opentelemetry/sdk/metrics/_internal/measurement_consumer.py",
  "opentelemetry-sdk/src/opentelemetry/sdk/metrics/_internal/metric_reader_storage.py",
  "opentelemetry-sdk/src/opentelemetry/sdk/metrics/_internal/view.py",
  "opentelemetry-sdk/benchmarks",
  "exporter/opentelemetry-exporter-http-transport/tests",
  "exporter/opentelemetry-exporter-otlp-proto-grpc/tests",
  "exporter/opentelemetry-exporter-otlp-proto-http/tests",
  "exporter/opentelemetry-exporter-otlp-json-common/tests",
  "exporter/opentelemetry-exporter-otlp-common/tests",
  "exporter/opentelemetry-exporter-otlp-json-common/benchmarks",
]

# When packages are correct typed add them to the strict list
strict = [
  "opentelemetry-semantic-conventions",
  "opentelemetry-sdk/src/opentelemetry/sdk/environment_variables",
  "opentelemetry-sdk/src/opentelemetry/sdk/resources",
]

[tool.datamodel-codegen]
input = "opentelemetry-configuration/src/opentelemetry/configuration/schema.json"
input-file-type = "jsonschema"
output = "opentelemetry-configuration/src/opentelemetry/configuration/models.py"
output-model-type = "dataclasses.dataclass"
field-constraints = true
formatters = ["ruff-format", "ruff-check"]
use-standard-collections = true
use-schema-description = true
use-title-as-name = true
use-union-operator = true
target-python-version = "3.10"
custom-template-dir = "opentelemetry-configuration/codegen"
additional-imports = "typing.ClassVar,opentelemetry.configuration._common._additional_properties"

[tool.towncrier]
directory = ".changelog"
filename = "CHANGELOG.md"
start_string = "<!-- changelog start -->\n"
template = "scripts/changelog_template.j2"
issue_format = "[#{issue}](https://github.com/open-telemetry/opentelemetry-python/pull/{issue})"
wrap = true # wrap fragments to 79 char line length
issue_pattern = "^(\\d+)" # only PR numbers as fragment prefix (e.g. 1234.fixed)

# NOTE: remember to update the changelog workflow if these types change
[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[tool.inline-snapshot]
format-command="ruff format --stdin-filename {filename}"

[dependency-groups]
dev = [
    "tox",
    "tox-uv>=1",
    "pre-commit",
    "datamodel-code-generator[http]",
    "datamodel-code-generator[ruff]",
    "towncrier",
]
