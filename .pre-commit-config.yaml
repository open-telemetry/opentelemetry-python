repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.0
    hooks:
      # Run the linter.
      - id: ruff
        args: ["--fix", "--show-fixes"]
      # Run the formatter.
      - id: ruff-format
      - id: ruff-format
        name: ruff-format (markdown & towncrier)
        types_or: [python, pyi, jupyter, markdown, text]
        files: \.(md|added|changed|deprecated|removed|fixed)$
        args: ["--preview"]
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.0
    hooks:
      - id: uv-lock
        args: ["--index-url", "https://pypi.org/simple"]
  - repo: https://github.com/rstcheck/rstcheck
    rev: 77490ffa33bfc0928975ae3cf904219903db755d # frozen: v6.2.5
    hooks:
      - id: rstcheck
        additional_dependencies: ['rstcheck[sphinx]']
        args: ["--report-level", "warning"]
